<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLG 行軍與滿士氣攻城計算器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-inner: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --highlight: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px 14px; min-height: 100vh; }
    .container { background-color: var(--card); border-radius: 14px; padding: 22px; width: 100%; max-width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border); }
    h1 { font-size: 1.3rem; margin-bottom: 18px; text-align: center; color: #fff; }
    
    .section-title { font-size: 0.9rem; font-weight: 700; color: #cbd5e1; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .coord-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .coord-row { display: flex; align-items: center; gap: 8px; }
    .coord-tag { font-size: 0.8rem; font-weight: 600; width: 55px; text-align: center; border-radius: 6px; padding: 6px 0; }
    .tag-start { background: #1e3a8a; color: #93c5fd; }
    .tag-mid { background: #374151; color: #d1d5db; }
    .tag-end { background: #7f1d1d; color: #fca5a5; }

    input[type="number"], input[type="datetime-local"] {
      background: var(--card-inner); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: #fff; font-size: 0.95rem; width: 100%;
    }
    input[type="number"]:focus, input[type="datetime-local"]:focus { outline: none; border-color: var(--accent); }
    
    .btn-remove { background: #334155; color: #ef4444; border: none; border-radius: 6px; width: 34px; height: 34px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .btn-remove:hover { background: #475569; }
    
    .btn-add { background: #334155; color: #e2e8f0; border: 1px dashed var(--border); border-radius: 8px; padding: 8px; font-size: 0.85rem; width: 100%; cursor: pointer; margin-bottom: 18px; transition: 0.2s; }
    .btn-add:hover { background: #475569; border-color: #64748b; }

    .target-time-box { background: var(--card-inner); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 18px; }
    .target-time-box label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .quick-btn-group { display: flex; gap: 6px; margin-top: 8px; }
    .quick-btn { background: #1e293b; border: 1px solid var(--border); color: #94a3b8; font-size: 0.75rem; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    .quick-btn:hover { color: #fff; border-color: var(--accent); }

    .btn-calc { width: 100%; background-color: var(--accent); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-calc:hover { background-color: var(--accent-hover); }

    .result-box { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
    .result-group { background: var(--card-inner); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--border); }
    .result-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .result-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 0.9rem; }
    .result-row:last-child { margin-bottom: 0; }
    .val-large { font-size: 1.15rem; font-weight: 700; }
    .text-highlight { color: var(--highlight); }
    .text-warning { color: var(--warning); }
    .badge { font-size: 0.7rem; background: var(--warning); color: #000; padding: 1px 5px; border-radius: 4px; margin-left: 4px; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚔️ 行軍與攻城時間精算器</h1>

  <div class="section-title">
    <span>行軍路徑座標</span>
  </div>

  <div class="coord-list" id="coordList">
    <!-- 起點 -->
    <div class="coord-row">
      <span class="coord-tag tag-start">起點</span>
      <input type="number" class="coord-x" placeholder="X" value="1">
      <input type="number" class="coord-y" placeholder="Y" value="1">
      <div style="width: 34px;"></div>
    </div>
    <!-- 預設中繼點 -->
    <div class="coord-row waypoint-row">
      <span class="coord-tag tag-mid">途經 1</span>
      <input type="number" class="coord-x" placeholder="X" value="3">
      <input type="number" class="coord-y" placeholder="Y" value="4">
      <button class="btn-remove" onclick="removeWaypoint(this)" title="刪除途經點">×</button>
    </div>
    <!-- 終點 -->
    <div class="coord-row" id="endPointRow">
      <span class="coord-tag tag-end">攻城點</span>
      <input type="number" class="coord-x" placeholder="X" value="3">
      <input type="number" class="coord-y" placeholder="Y" value="3">
      <div style="width: 34px;"></div>
    </div>
  </div>

  <button class="btn-add" onclick="addWaypoint()">＋ 插入非直線途經點（避障/繞路）</button>

  <div class="target-time-box">
    <label>🎯 設定預定滿士氣【攻城開打時間】：</label>
    <input type="datetime-local" id="siegeTime">
    <div class="quick-btn-group">
      <button class="quick-btn" onclick="setQuickSiegeTime(20, 0)">今晚 20:00</button>
      <button class="quick-btn" onclick="setQuickSiegeTime(21, 0)">今晚 21:00</button>
      <button class="quick-btn" onclick="setQuickSiegeTime(22, 0)">今晚 22:00</button>
      <button class="quick-btn" onclick="clearSiegeTime()">清除</button>
    </div>
  </div>

  <button class="btn-calc" onclick="calculate()">精算行軍排程</button>

  <div class="result-box" id="resultBox">
    <!-- 基礎路程與耗時 -->
    <div class="result-group">
      <div class="result-title">路程耗時總計</div>
      <div class="result-row">
        <span>切比雪夫總距離</span>
        <span class="val-large" id="distVal">-</span>
      </div>
      <div class="result-row" id="breakdownRow" style="font-size:0.8rem; color:#64748b;"></div>
      <div class="result-row" style="margin-top:6px;">
        <span>行軍耗時 (30秒/格)</span>
        <span id="marchTimeVal">-</span>
      </div>
      <div class="result-row">
        <span>士氣恢復 (2分/格)</span>
        <span id="moraleTimeVal">-</span>
      </div>
      <div class="result-row" style="border-top:1px dashed var(--border); padding-top:6px; margin-top:6px;">
        <span>單趟所需總時間</span>
        <span class="text-highlight" id="totalTimeVal">-</span>
      </div>
    </div>

    <!-- 反推時間區塊 -->
    <div class="result-group" id="reverseScheduleBox" style="border-color: #3b82f6;">
      <div class="result-title" style="color: #60a5fa;">🎯 攻城逆推作戰排程</div>
      <div class="result-row">
        <span>預定滿士氣開打：</span>
        <span id="targetSiegeDisplay">-</span>
      </div>
      <div class="result-row" style="border-top: 1px dashed var(--border); padding-top:6px; margin-top:6px;">
        <span style="font-weight: 600; color: #f59e0b;">🚩 最晚起步時間：</span>
        <span class="val-large text-warning" id="departureTimeVal">-</span>
      </div>
      <div class="result-row">
        <span style="color: #94a3b8;">行軍抵達目標時間：</span>
        <span id="arrivalTimeVal">-</span>
      </div>
    </div>
  </div>
</div>

<script>
  let waypointCount = 1;

  function addWaypoint() {
    waypointCount++;
    const endRow = document.getElementById('endPointRow');
    const newRow = document.createElement('div');
    newRow.className = 'coord-row waypoint-row';
    newRow.innerHTML = `
      <span class="coord-tag tag-mid">途經</span>
      <input type="number" class="coord-x" placeholder="X">
      <input type="number" class="coord-y" placeholder="Y">
      <button class="btn-remove" onclick="removeWaypoint(this)" title="刪除途經點">×</button>
    `;
    endRow.parentNode.insertBefore(newRow, endRow);
    renumberWaypoints();
  }

  function removeWaypoint(btn) {
    btn.parentElement.remove();
    renumberWaypoints();
    calculate();
  }

  function renumberWaypoints() {
    const waypoints = document.querySelectorAll('.waypoint-row');
    waypoints.forEach((row, idx) => {
      row.querySelector('.coord-tag').innerText = `途經 ${idx + 1}`;
    });
  }

  function formatDuration(totalSec) {
    const hours = Math.floor(totalSec / 3600);
    const minutes = Math.floor((totalSec % 3600) / 60);
    const seconds = totalSec % 60;
    let parts = [];
    if (hours > 0) parts.push(`${hours} 小時`);
    if (minutes > 0 || hours > 0) parts.push(`${minutes} 分`);
    parts.push(`${seconds} 秒`);
    return parts.join(' ');
  }

  function formatTime(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function setQuickSiegeTime(h, m) {
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    if (target < now) {
      target.setDate(target.getDate() + 1); // 如果已過則設為明天
    }
    const pad = n => String(n).padStart(2, '0');
    const localIso = `${target.getFullYear()}-${pad(target.getMonth()+1)}-${pad(target.getDate())}T${pad(target.getHours())}:${pad(target.getMinutes())}`;
    document.getElementById('siegeTime').value = localIso;
    calculate();
  }

  function clearSiegeTime() {
    document.getElementById('siegeTime').value = '';
    calculate();
  }

  function calculate() {
    const rows = document.querySelectorAll('.coord-row');
    let points = [];
    for (let r of rows) {
      const x = parseFloat(r.querySelector('.coord-x').value);
      const y = parseFloat(r.querySelector('.coord-y').value);
      if (isNaN(x) || isNaN(y)) {
        alert("請確認所有座標欄位皆已輸入完整數字！");
        return;
      }
      points.push({ x, y });
    }

    if (points.length < 2) return;

    // 計算各段切比雪夫距離
    let totalDist = 0;
    let breakdown = [];
    for (let i = 0; i < points.length - 1; i++) {
      const d = Math.max(Math.abs(points[i+1].x - points[i].x), Math.abs(points[i+1].y - points[i].y));
      breakdown.push(`段${i+1}: ${d}格`);
      totalDist += d;
    }

    // 行軍耗時 (30秒/格)
    const marchSeconds = totalDist * 30;

    // 士氣恢復 (2分/格，上限 200 分鐘)
    const rawMoraleMinutes = totalDist * 2;
    const isCapped = rawMoraleMinutes >= 200;
    const moraleMinutes = Math.min(rawMoraleMinutes, 200);
    const moraleSeconds = moraleMinutes * 60;

    // 總耗時
    const totalDurationSeconds = marchSeconds + moraleSeconds;

    // 渲染基礎路程
    document.getElementById('distVal').innerText = `${totalDist} 格`;
    document.getElementById('breakdownRow').innerText = breakdown.length > 1 ? `(${breakdown.join(' ➔ ')})` : '';
    document.getElementById('marchTimeVal').innerText = formatDuration(marchSeconds);
    document.getElementById('moraleTimeVal').innerHTML = formatDuration(moraleSeconds) + (isCapped ? ' <span class="badge">已達200分上限</span>' : '');
    document.getElementById('totalTimeVal').innerText = formatDuration(totalDurationSeconds);

    // 反推時間邏輯
    const siegeVal = document.getElementById('siegeTime').value;
    const reverseBox = document.getElementById('reverseScheduleBox');

    if (siegeVal) {
      const siegeDate = new Date(siegeVal);
      // 起步時間 = 攻城時間 - 總耗時
      const departureDate = new Date(siegeDate.getTime() - totalDurationSeconds * 1000);
      // 抵達目標時間 = 攻城時間 - 士氣恢復時間 (即 出發 + 行軍時間)
      const arrivalDate = new Date(siegeDate.getTime() - moraleSeconds * 1000);

      document.getElementById('targetSiegeDisplay').innerText = formatTime(siegeDate);
      document.getElementById('departureTimeVal').innerText = formatTime(departureDate);
      document.getElementById('arrivalTimeVal').innerText = formatTime(arrivalDate);
      reverseBox.style.display = 'block';
    } else {
      // 若沒填攻城時間，預設展示「若現在起步」的時間推算
      const now = new Date();
      const arrivalDate = new Date(now.getTime() + marchSeconds * 1000);
      const fullMoraleDate = new Date(now.getTime() + totalDurationSeconds * 1000);

      document.getElementById('targetSiegeDisplay').innerText = "(未指定，顯示若現在起步)";
      document.getElementById('departureTimeVal').innerText = formatTime(now) + " (立刻出發)";
      document.getElementById('arrivalTimeVal').innerText = `${formatTime(arrivalDate)} (滿士氣: ${formatTime(fullMoraleDate)})`;
    }
  }

  // 預設初始化攻城時間為今晚 21:00
  setQuickSiegeTime(21, 0);
</script>

</body>
</html>
